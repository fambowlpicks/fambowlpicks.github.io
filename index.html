<title>Family Bowl Pick'em</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0f'/%3E%3Cg transform='rotate(-35 32 32)'%3E%3Cellipse cx='32' cy='32' rx='22' ry='13' fill='%23d4af37'/%3E%3Cpath d='M20 32h24' stroke='%230d0d0f' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M26 28v8M30 28v8M34 28v8M38 28v8' stroke='%230d0d0f' stroke-width='2.5' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">

<style>
  :root{
    --bg:#f4f3ef; --card:#fff; --ink:#111214; --muted:#5f6068; --line:#e4e1d8;
    --black:#0d0d0f; --black2:#1b1b1f; --gold:#d4af37; --gold2:#ecd27a; --goldDark:#8c6d14; --goldTint:#fbf5e3;
    --win:#1d7a3a; --winbg:#e3f3e7; --loss:#b3261e; --lossbg:#fbe5e3; --pend:#5f6068; --pendbg:#f3f2ee;
    --head:"Oswald","Arial Narrow",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45}
  a{color:inherit}

  /* header */
  header{background:var(--black);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold)}
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#fff;margin-bottom:10px}
  .brand svg{width:34px;height:34px;flex:none}
  .brand span{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
  .brand span b{color:var(--gold);font-weight:700}
  .hello{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 10px;font-size:15px;color:#cfcfd4}
  .hello a{color:var(--gold2)}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav a{color:#fff;text-decoration:none;font-family:var(--head);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:16px;padding:9px 16px;border-radius:8px;border:1px solid rgba(212,175,55,.45)}
  nav a:hover{border-color:var(--gold)}
  nav a.on{background:var(--gold);border-color:var(--gold);color:var(--black)}

  main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h2{font-family:var(--head);font-weight:600;font-size:26px;letter-spacing:.02em;margin:2px 0 12px;text-transform:capitalize}
  h3{font-family:var(--head);font-weight:600;font-size:20px;letter-spacing:.02em;margin:0 0 8px;text-transform:capitalize}
  .banner{background:var(--black);color:#fff;border-radius:12px;padding:13px 16px;font-weight:600;margin-bottom:16px;border-left:6px solid var(--gold)}
  .muted{color:var(--muted)}
  .small{font-size:14px}

  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .num{text-align:center}
  .rank{font-family:var(--head);font-weight:700;font-size:22px;width:52px;text-align:center}
  .r1{color:var(--goldDark)}.r2{color:#6b7280}.r3{color:#8b5a2b}
  a.person{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--gold)}
  a.person:hover{color:var(--goldDark)}

  /* name buttons (welcome + picks tab) */
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .names a,.names button{display:flex;align-items:center;justify-content:center;min-height:56px;padding:10px 12px;border-radius:10px;background:#fff;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-family:var(--head);font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .12s}
  .names a:hover,.names button:hover{border-color:var(--gold);box-shadow:0 2px 0 var(--gold)}
  .names a.me{background:var(--gold);border-color:var(--gold);color:var(--black)}
  .names a.on{background:var(--black);border-color:var(--black);color:var(--gold)}
  .names a.all{background:var(--black);border-color:var(--black);color:#fff}
  .names a.all:hover{color:var(--gold)}
  .names a.wide{grid-column:1/-1}
  .names.compact{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;scrollbar-width:thin}
  .names.compact a{flex:none;min-height:44px;font-size:16px;padding:8px 14px}

  .big{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:130px;background:#faf9f6;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .v{font-family:var(--head);font-size:36px;font-weight:700;line-height:1.1}
  .stat .l{color:var(--muted);font-size:14px}
  .minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .mini{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
  .mini b{display:block;font-family:var(--head);font-size:24px;line-height:1.2}
  .mini span{color:var(--muted);font-size:13px}
  @media(max-width:700px){ .minis{grid-template-columns:repeat(2,1fr)} }

  .w{background:var(--winbg);color:var(--win);font-weight:600}
  .x{background:var(--lossbg);color:var(--loss);font-weight:600}
  .p{background:var(--pendbg);color:var(--pend)}
  .team{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:600}
  .team.tw{background:var(--winbg);color:var(--win)}
  .team.tl{background:var(--lossbg);color:var(--loss)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700;letter-spacing:.03em}
  .cfp{background:var(--black);color:var(--gold)}
  .blogo{display:inline-flex;align-items:center;justify-content:center;flex:none}
  .blogo img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
  .withlogo{display:flex;align-items:center;gap:10px}
  .tvlogo{display:inline-flex;align-items:center;gap:2px;height:26px;vertical-align:middle}
  .tvlogo img{height:17px;width:auto;display:block}
  .tvlogo.round{height:32px}
  .tvlogo.round img{height:30px}
  .tvlogo b{font-family:var(--head);font-size:15px;color:#e4161c;line-height:1}
  .tv{display:inline-block;min-width:46px;text-align:center;padding:3px 8px;border-radius:6px;font-size:13px;font-weight:800;letter-spacing:.04em;color:#fff;background:#6b7280}

  .scroll{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  .grid{font-size:14px;border-collapse:separate;border-spacing:0}
  .grid th,.grid td{padding:7px 9px;white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .grid thead th{position:sticky;top:0;background:var(--black);color:#fff;z-index:2;font-size:13px}
  .grid thead th a{color:#fff;text-decoration:none}
  .grid td.game{position:sticky;left:0;background:#fff;z-index:1;font-weight:600}
  .grid thead th.game{left:0;z-index:3}
  .grid .mycol{box-shadow:inset 0 0 0 999px rgba(212,175,55,.18)}
  .grid thead th.mycol{background:var(--gold);color:var(--black)}
  .grid thead th.mycol a{color:var(--black)}

  .btn{display:inline-block;font:inherit;font-size:16px;font-weight:700;padding:11px 16px;border-radius:10px;border:2px solid var(--black);background:var(--black);color:#fff;cursor:pointer;text-decoration:none}
  .btn:hover{color:var(--gold)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--black)}
  .btn.ghost{background:#fff;color:var(--black)}
  .btn.pick{background:#fff;color:var(--ink);border-color:var(--line);font-weight:600}
  .btn.pick.sel{background:var(--winbg);color:var(--win);border-color:var(--win)}
  .btn.ghost.selp{background:var(--pendbg);color:var(--ink);border-color:var(--muted)}
  .btn[disabled]{opacity:.6;cursor:wait}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .inp{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);margin:0 8px 8px 0}

  tr.mine td{background:var(--goldTint)}
  tr.mine td:first-child{box-shadow:inset 5px 0 0 var(--gold)}
  .you{border:2px solid var(--gold);background:var(--goldTint)}
  .root{border-left:5px solid var(--gold)}
  .welcome{max-width:720px;margin:24px auto;text-align:center}
  .welcome h2{font-size:34px;margin-bottom:4px}
  .welcome p{margin:0 0 20px;color:var(--muted)}

  /* home feed */
  .feed{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .feed .card{margin-bottom:0}
  .top5 td{padding:17px 8px;font-size:24px}
  .top5 .rank{font-size:30px}
  .top5 td b{font-family:var(--head);font-size:30px}
  .span2{grid-column:1/-1}
  .gamerow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .gamerow:last-child{border-bottom:none}
  .gamerow .when{width:72px;flex:none;font-family:var(--head);font-weight:600;color:var(--goldDark);font-size:15px;text-align:center;line-height:1.2}
  .gamerow .what{flex:1;min-width:0}
  .gamerow .what b{display:block}
  .gamerow .meta{flex:none;text-align:right}
  .announce{border-left:5px solid var(--gold)}
  .announce p{margin:0 0 8px}
  .announce p:last-child{margin-bottom:0}
  .quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .quick a{display:block;text-align:center;padding:14px 10px;border-radius:10px;background:var(--black);color:#fff;text-decoration:none;font-family:var(--head);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .quick a:hover{color:var(--gold)}

  /* profile photos */
  .av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;vertical-align:middle;color:#fff;font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:.02em;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);text-transform:uppercase}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .av.xs{width:26px;height:26px;font-size:11px;border-width:1.5px}
  .av.sm{width:32px;height:32px;font-size:13px}
  .av.md{width:64px;height:64px;font-size:24px;border-width:3px}
  .av.lg{width:96px;height:96px;font-size:36px;border-width:4px;box-shadow:0 0 0 3px var(--gold),0 2px 6px rgba(0,0,0,.25)}
  .who{display:inline-flex;align-items:center;gap:10px}
  .names a,.names button{gap:10px}
  .names.faces a{flex-direction:column;gap:6px;padding:12px 8px}
  .names.compact a{padding:6px 14px 6px 6px}
  .grid thead th.pcol{text-align:center}
  .grid thead th.pcol .av{margin-bottom:3px}
  .member-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .member-head h2{margin:0}
  .hello .who{gap:8px}

  @media(max-width:700px){ .feed{grid-template-columns:1fr} }
  @media(max-width:600px){ body{font-size:17px} .hide-sm{display:none} .brand span{font-size:21px} .names{grid-template-columns:repeat(2,1fr)} .stat .v{font-size:30px}
    th,td{padding:9px 4px} th{font-size:11px;letter-spacing:.03em} .rank{width:34px;font-size:20px} .who{gap:6px} td .av.sm{width:28px;height:28px;font-size:12px} .names a{gap:6px;padding:8px 6px;font-size:17px;min-width:0} .names:not(.faces) .av:not(.sm){width:32px;height:32px;font-size:13px} }
</style>
</head>

// ---------- state ----------
let MODE = API_URL ? "loading" : "demo";   // demo | loading | live | error
let LOAD_ERROR = "";
let games = [];          // {id,i,date,time,bowl,a,h,tv,pts,round,playoff,winner}
let NAMES = [];          // everyone playing
let PICKS = {};          // name -> {picks:[team per game], ot, score}   (only once picks lock)
let META = { season:"", locked:true, lockAt:null, submitted:[], ot:null, score:null, announcements:[] };
let asOf = Infinity;     // admin-only test mode
let DATA_VERSION = 0;

function loadDemo(){
  games = G.map((g,i)=>{ const [date,time,bowl,a,h,w,tv,pts,round]=g; return {id:"g"+(i+1),i,date,time,bowl,a,h,tv,pts,round,playoff:!!round,winner:w==="A"?a:h}; });
  NAMES = [...PEOPLE];
  PICKS = {};
  PEOPLE.forEach((p,pi)=>{ PICKS[p] = { picks: G.map(g=>{ const v=g[9][pi]; return v==="A"?g[3] : v==="H"?g[4] : v; }), ot: OT_GUESS[pi], score: null }; });
  META = { season:"2025-26 (demo data)", locked:true, lockAt:null, submitted:[...PEOPLE], ot:ACTUAL_OT, score:null, announcements:[] };
  DATA_VERSION++;
}

function loadFromApi(d){
  games = (d.games||[]).map((g,i)=>{
    const a=String(g.a||""), h=String(g.h||"");
    const winner = same(g.winner,a) ? a : same(g.winner,h) ? h : null;
    return {id:String(g.id), i, date:String(g.date||""), time:String(g.time||""), bowl:String(g.bowl||""), a, h, tv:String(g.tv||""), pts:Number(g.pts)||0, round:String(g.round||""), playoff:!!g.round, winner};
  });
  NAMES = (d.people||[]).map(String);
  PICKS = {};
  (d.picks||[]).forEach(p=>{
    const name = NAMES.find(n=>same(n,p.name)) || String(p.name);
    PICKS[name] = { picks: games.map(g=>String((p.picks||{})[g.id]||"")), ot: p.ot, score: p.score };
  });
  const ann = Array.isArray(d.announcements) ? d.announcements : (d.announcement ? String(d.announcement).split(/\n+/) : []);
  META = { season:String(d.season||""), locked:!!d.locked, lockAt:d.lockAt||null, submitted:(d.submitted||[]).map(String), ot:d.ot??null, score:d.score??null,
           announcements: ann.map(s=>String(s).trim()).filter(Boolean) };
  DATA_VERSION++;
}

async function fetchData(){
  if(!API_URL){ loadDemo(); MODE="demo"; return; }
  try{
    const r = await fetch(API_URL + (API_URL.includes("?")?"&":"?") + "t=" + Date.now());
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||"bad response");
    loadFromApi(d); MODE="live"; LOAD_ERROR="";
  }catch(e){
    if(MODE!=="live"){ MODE="error"; }
    LOAD_ERROR = String(e.message||e);
  }
}

async function post(body){
  if(!API_URL) return {ok:false, error:"The site isn't connected to the Google Sheet yet."};
  try{
    const r = await fetch(API_URL, {method:"POST", body:JSON.stringify(body)});
    return await r.json();
  }catch(e){ return {ok:false, error:"Couldn't reach the Google Sheet. Check your internet and try again."}; }
}

// ---------- dates ("12/13" from the sheet → a real date in this season) ----------
function seasonStartYear(today){ return today.getMonth()>=6 ? today.getFullYear() : today.getFullYear()-1; }
function gameDay(g){
  const m = String(g.date||"").match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(!m) return null;
  const mo=+m[1]-1, d=+m[2];
  let y = m[3] ? +m[3] : null;
  if(y!==null && y<100) y+=2000;
  if(y===null){ const start=seasonStartYear(new Date()); y = mo>=6 ? start : start+1; }
  return new Date(y,mo,d);
}
const dayKey = dt => dt ? dt.getFullYear()+"-"+dt.getMonth()+"-"+dt.getDate() : "";
const fmtDay = dt => dt.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});

// ---------- scoring ----------
const isDone = g => !!g.winner && g.i < asOf;
const doneCount = () => games.filter(isDone).length;
const players = () => NAMES.filter(n=>PICKS[n]);
const pickOf = (name,g) => PICKS[name] ? PICKS[name].picks[g.i] : "";
const allDone = () => games.length>0 && games.every(isDone);

function standings(){
  const final = allDone();
  const rows = players().map(name=>{
    let pts=0,correct=0,po=0,remain=0;
    games.forEach(g=>{
      const pick = pickOf(name,g);
      if(isDone(g)){ if(same(pick,g.winner)){pts+=g.pts;correct++;if(g.playoff)po++;} }
      else if(same(pick,g.a)||same(pick,g.h)){ remain+=g.pts; }
    });
    const p = PICKS[name];
    const otDiff = (META.ot!==null && p.ot!==null && p.ot!==undefined) ? Math.abs(p.ot-META.ot) : 0;
    const scDiff = (META.score!==null && p.score!==null && p.score!==undefined) ? Math.abs(p.score-META.score) : 0;
    return {name,pts,correct,po,remain,ot:p.ot,score:p.score,otDiff,scDiff};
  });
  rows.sort((x,y)=> y.pts-x.pts || y.correct-x.correct || y.po-x.po || (final?(x.otDiff-y.otDiff)||(x.scDiff-y.scDiff):0) || x.name.localeCompare(y.name));
  rows.forEach((r,i)=>{
    const p=rows[i-1];
    const tied = p && p.pts===r.pts && p.correct===r.correct && p.po===r.po && (!final || (p.otDiff===r.otDiff && p.scDiff===r.scDiff));
    r.rank = tied ? p.rank : i+1;
  });
  return rows;
}

// Chance to win: play out every remaining game many times as a coin flip, count how often each person finishes first.
let winCache = {key:"", map:{}};
function winChances(){
  const key = DATA_VERSION+"|"+asOf;
  if(winCache.key===key) return winCache.map;
  const ps = players(); const map = {};
  if(!ps.length){ winCache={key,map}; return map; }
  const base = standings().reduce((o,r)=>(o[r.name]=r,o),{});
  const left = games.filter(g=>!isDone(g));
  if(!left.length){
    const s=standings(); const top=s.filter(r=>r.rank===1);
    ps.forEach(n=>map[n]= top.some(t=>t.name===n) ? 100/top.length : 0);
    winCache={key,map}; return map;
  }
  const N = 4000; const wins = {}; ps.forEach(n=>wins[n]=0);
  const pickA = left.map(g=>ps.map(n=>same(pickOf(n,g),g.a)));
  const pickH = left.map(g=>ps.map(n=>same(pickOf(n,g),g.h)));
  for(let t=0;t<N;t++){
    const pts = ps.map(n=>base[n].pts), cor = ps.map(n=>base[n].correct), po = ps.map(n=>base[n].po);
    for(let k=0;k<left.length;k++){
      const aWins = Math.random()<0.5; const hit = aWins ? pickA[k] : pickH[k]; const g=left[k];
      for(let j=0;j<ps.length;j++) if(hit[j]){ pts[j]+=g.pts; cor[j]++; if(g.playoff) po[j]++; }
    }
    let best=[0];
    for(let j=1;j<ps.length;j++){
      const b=best[0]; const c = (pts[j]-pts[b]) || (cor[j]-cor[b]) || (po[j]-po[b]);
      if(c>0) best=[j]; else if(c===0) best.push(j);
    }
    best.forEach(j=>wins[ps[j]]+=1/best.length);
  }
  ps.forEach(n=>map[n]=wins[n]/N*100);
  winCache={key,map}; return map;
}
// Highest / lowest finishing rank still possible for one person.
// Checks the best-case and worst-case outcomes for them, plus thousands of random outcomes.
let rangeCache = {key:"", map:{}};
function rankRange(name){
  const key = DATA_VERSION+"|"+asOf;
  if(rangeCache.key!==key) rangeCache={key,map:{}};
  if(rangeCache.map[name]) return rangeCache.map[name];
  const ps = players(); const me = ps.indexOf(name);
  const base = standings().reduce((o,r)=>(o[r.name]=r,o),{});
  const left = games.filter(g=>!isDone(g));
  const pickA = left.map(g=>ps.map(n=>same(pickOf(n,g),g.a)));
  const pickH = left.map(g=>ps.map(n=>same(pickOf(n,g),g.h)));
  const rankOf = winnersA => {
    const pts = ps.map(n=>base[n].pts), cor = ps.map(n=>base[n].correct), po = ps.map(n=>base[n].po);
    left.forEach((g,k)=>{ const hit = winnersA[k] ? pickA[k] : pickH[k]; for(let j=0;j<ps.length;j++) if(hit[j]){ pts[j]+=g.pts; cor[j]++; if(g.playoff) po[j]++; } });
    let r=1; for(let j=0;j<ps.length;j++){ if(j===me) continue; const c=(pts[j]-pts[me])||(cor[j]-cor[me])||(po[j]-po[me]); if(c>0) r++; }
    return r;
  };
  const count = (k,side) => (side?pickA[k]:pickH[k]).filter(Boolean).length;
  // best case: my picks win; where I can't score, the side fewer people picked wins
  const best = left.map((g,k)=> pickA[k][me] ? true : pickH[k][me] ? false : count(k,true)<=count(k,false));
  // worst case: my picks lose; where I can't score, the side more people picked wins
  const worst = left.map((g,k)=> pickA[k][me] ? false : pickH[k][me] ? true : count(k,true)>=count(k,false));
  let lo=rankOf(best), hi=rankOf(worst); lo=Math.min(lo,hi); hi=Math.max(hi,rankOf(best));
  if(left.length){ for(let t=0;t<3000;t++){ const r=rankOf(left.map(()=>Math.random()<0.5)); if(r<lo) lo=r; if(r>hi) hi=r; } }
  return (rangeCache.map[name]={best:lo, worst:hi});
}

function bowlLogoSrc(g){
  const text = (String(g.bowl||"")+" "+String(g.round||"")).toLowerCase().replace(/[’]/g,"'");
  for(const [re,key] of BOWL_MATCH){ if(re.test(text)) return BOWL_LOGOS[key]; }
  return null;
}

const tvBadge = tv => {
  const t=String(tv||"").trim(); if(!t) return `<span class="muted">—</span>`;
  const T=t.toUpperCase();
  if(TV_LOGOS[T]) return `<span class="tvlogo ${T==="ABC"||T==="TNT"?"round":""}" title="${esc(T)}"><img src="${TV_LOGOS[T]}" alt="${esc(T)}"></span>`;
  const m=T.match(/^ESPN(2|U|NEWS)$/);
  if(m) return `<span class="tvlogo" title="${esc(T)}"><img src="${TV_LOGOS.ESPN}" alt="${esc(T)}"><b>${m[1]}</b></span>`;
  const c=TV_COLORS[T]||"#55565c"; return `<span class="tv" style="background:${c}">${esc(T)}</span>`;
};

// ---------- profile photos ----------
// Photos sit right next to index.html in the repo, named after each person: derrick.jpg
// "Landon R" -> landon_r.jpg. Anyone without a photo gets a colored circle with their initials.
// If someone's name on the site doesn't match their photo's file name, add them here:
const PHOTO_ALIASES = { nat: "natalie" };
const AV_COLORS = ["#1b1b1f","#8c6d14","#1d7a3a","#0b3d91","#b3261e","#5b2c83","#0e7490","#9a3412"];
const photoKey = n => { const k=String(n||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""); return PHOTO_ALIASES[k]||k; };
const initials = n => String(n||"").trim().split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase();
const avColor = n => { let h=0; for(const c of photoKey(n)) h=(h*31+c.charCodeAt(0))>>>0; return AV_COLORS[h%AV_COLORS.length]; };
window.avFail = img => { const s=img.parentNode; s.textContent=s.dataset.i; };
// size: "xs" | "sm" | "" | "md" | "lg"
const avatar = (n, size="") => `<span class="av ${size}" style="background:${avColor(n)}" data-i="${esc(initials(n))}"><img src="${encodeURIComponent(photoKey(n))}.jpg" alt="" onerror="avFail(this)"></span>`;

// ---------- who am I (saved on this device) ----------
let ME = store.get("pickem-me");
const isMe = n => ME && same(ME,n);
const namesMeFirst = () => [...NAMES].sort((a,b)=>(isMe(b)-isMe(a))||a.localeCompare(b));
const nameKey = n => encodeURIComponent(n);
const shown = n => isMe(n) ? "Me" : esc(cap(n));
window.chooseMe = i => { ME = NAMES[i]; store.set("pickem-me",ME); location.hash = "#/"; render(); };
window.switchMe = () => { ME=null; store.del("pickem-me"); location.hash="#/welcome"; render(); };

// ---------- shared pieces ----------
const app=document.getElementById("app");
function nav(active){
  const links=[["#/leaderboard","Leaderboard"],["#/members","Picks"],["#/schedule","Schedule"],["#/history","History"]];
  document.getElementById("nav").innerHTML=links.map(([h,t])=>`<a href="${h}" class="${active===h?"on":""}">${t}</a>`).join("");
}
const rankCls = r => r===1?"r1":r===2?"r2":r===3?"r3":"";
const personLink = n => `<span class="who">${avatar(n,"sm")}<a class="person" href="#/member/${nameKey(n)}">${esc(cap(n))}</a></span>`;
const btn = (href,text,cls="") => `<a class="btn ${cls}" href="${href}">${text}</a>`;

function modeNote(){
  if(MODE==="demo") return `<div class="card" style="background:#eef2f8;border-color:#cdd8ea"><b>Demo mode:</b> showing last season's picks and results.</div>`;
  if(MODE==="error") return `<div class="card" style="color:var(--loss)"><b>Can't reach the Google Sheet right now.</b> Check your internet and refresh the page.</div>`;
  if(MODE==="loading") return `<div class="card muted">Loading the latest picks and results…</div>`;
  return "";
}

function hello(){
  const el=document.getElementById("hello");
  if(!ME){el.innerHTML="";return;}
  el.innerHTML = `<span class="who">${avatar(ME,"xs")}<span>Signed in as <a href="#/member/${nameKey(ME)}"><b>${esc(cap(ME))}</b></a></span></span><span><a href="#/admin">Admin</a> &nbsp;·&nbsp; <a href="javascript:void 0" onclick="switchMe()">Not you? Switch</a></span>`;
}

function submittedCard(){
  const sub = n => META.submitted.some(s=>same(s,n));
  const count = NAMES.filter(sub).length;
  return `<div class="card"><h2>Picks Turned In <span class="muted" style="font-size:18px">(${count} of ${NAMES.length})</span></h2>

// "You're tied with ___" message, naming the next game where your picks differ
function tieMessage(name, you){
  const rows=standings(); const me=rows.find(r=>r.name===name);
  if(!me || me.pts!==rows[0].pts) return null;
  const others=rows.filter(r=>r.pts===me.pts && r.name!==name);
  if(!others.length) return null;
  const nm=n=>esc(cap(n));
  const list = others.length===1 ? nm(others[0].name) : others.slice(0,-1).map(r=>nm(r.name)).join(", ")+" and "+nm(others[others.length-1].name);
  let msg = `${you?"You're":nm(name)+" is"} tied for first with ${list}.`;
  const rival=others[0].name;
  const next=games.find(g=>!isDone(g) && !same(pickOf(name,g),pickOf(rival,g)));
  if(next) msg += ` The tiebreaker game is the ${esc(next.bowl)} (${esc(next.date)}${next.time?" at "+esc(next.time):""}): ${you?"you":nm(name)} picked <b>${esc(pickOf(name,next)||"—")}</b>, ${nm(rival)} picked <b>${esc(pickOf(rival,next)||"—")}</b>.`;
  else if(games.some(g=>!isDone(g))) msg += ` ${you?"You":nm(name)} and ${nm(rival)} picked the same teams in every game left, so the tiebreakers decide it.`;
  else msg += ` The tiebreakers decide the final order.`;
  return msg;
}

// ---------- automatic headlines for the home page ----------
// Ranks using only the games in `doneSet` (same scoring + first tiebreakers as the leaderboard)
function ranksWith(doneSet){
  const rows = players().map(name=>{
    let pts=0,correct=0,po=0;
    games.forEach(g=>{ if(doneSet.has(g) && same(pickOf(name,g),g.winner)){ pts+=g.pts; correct++; if(g.playoff) po++; } });
    return {name,pts,correct,po};
  });
  rows.sort((x,y)=> y.pts-x.pts || y.correct-x.correct || y.po-x.po);
  rows.forEach((r,i)=>{ const p=rows[i-1]; r.rank = p && p.pts===r.pts && p.correct===r.correct && p.po===r.po ? p.rank : i+1; });
  return rows;
}
function autoHeadlines(){
  const nm = n => esc(cap(n));
  const listNames = arr => arr.length===1 ? arr[0] : arr.slice(0,-1).join(", ")+" and "+arr[arr.length-1];
  const done = games.filter(isDone);
  const last = done[done.length-1];
  // the most recent day that has results ("today", "yesterday" or the date)
  const lastKey = g => dayKey(gameDay(g)) || g.date;
  const dayGames = done.filter(g=>lastKey(g)===lastKey(last));
  const d = gameDay(last); const today=new Date(); const yest=new Date(today); yest.setDate(today.getDate()-1);
  const when = d && dayKey(d)===dayKey(today) ? "today" : d && dayKey(d)===dayKey(yest) ? "yesterday" : `on ${esc(last.date)}`;
  const now = ranksWith(new Set(done));
  const before = ranksWith(new Set(done.filter(g=>!dayGames.includes(g))));
  const hadBefore = done.length > dayGames.length;
  const out = [];

  // 1. who's on top
  const leaders = now.filter(r=>r.rank===1);
  const leadersBefore = before.filter(r=>r.rank===1).map(r=>r.name);
  if(allDone()){
    const champ = standings().filter(r=>r.rank===1);   // full tiebreakers at season's end
    out.push(champ.length===1 ? `${nm(champ[0].name)} wins ${META.season?"the "+esc(META.season)+" ":"the "}Pick'em with ${champ[0].pts} points!` : `${listNames(champ.map(r=>nm(r.name)))} finish tied for first with ${champ[0].pts} points!`);
  }
  else if(leaders.length===now.length && now.length>1) out.push(`Everyone is tied at ${leaders[0].pts} points!`);
  else if(leaders.length>=4) out.push(`${leaders.length} people are tied for first with ${leaders[0].pts} points!`);
  else if(leaders.length>1) out.push(`${listNames(leaders.map(r=>nm(r.name)))} are tied for first with ${leaders[0].pts} points!`);
  else if(hadBefore && !leadersBefore.includes(leaders[0].name)) out.push(`${nm(leaders[0].name)} is now in first place!`);
  else if(hadBefore && leadersBefore.length>1) out.push(`${nm(leaders[0].name)} broke the tie and leads with ${leaders[0].pts} points!`);
  else out.push(`${nm(leaders[0].name)} leads with ${leaders[0].pts} points.`);

  // 2. biggest climber since the last day of games
  if(hadBefore){
    const moves = now.map(r=>({name:r.name, up:(before.find(b=>b.name===r.name)||r).rank - r.rank})).filter(m=>m.up>=2).sort((a,b)=>b.up-a.up);
    if(moves.length){
      const top = moves.filter(m=>m.up===moves[0].up);
      out.push(top.length===1 ? `${nm(top[0].name)} jumped up ${top[0].up} spots ${when}!` : `${listNames(top.map(m=>nm(m.name)))} each jumped up ${top[0].up} spots ${when}!`);
    }
  }

  // 3. perfect day (2+ games that day)
  if(dayGames.length>=2){
    const perfect = players().filter(n=>dayGames.every(g=>same(pickOf(n,g),g.winner)));
    if(perfect.length && perfect.length<=3) out.push(`${listNames(perfect.map(nm))} went ${dayGames.length}-for-${dayGames.length} ${when}!`);
    else if(perfect.length===0) out.push(`Nobody went ${dayGames.length}-for-${dayGames.length} ${when}.`);
  }

  // 4. upset alert: most recent game that few people picked
  const ps = players();
  const upset = [...dayGames].reverse().find(g=>{ const n=ps.filter(p=>same(pickOf(p,g),g.winner)).length; return n<=Math.max(1,Math.floor(ps.length*0.25)); });
  if(upset){
    const n=ps.filter(p=>same(pickOf(p,upset),upset.winner)).length; const loser=upset.winner===upset.a?upset.h:upset.a;
    out.push(n===0 ? `Upset! Nobody picked ${esc(upset.winner)} to beat ${esc(loser)}.` : n===1 ? `Upset! Only ${nm(ps.find(p=>same(pickOf(p,upset),upset.winner)))} picked ${esc(upset.winner)} to beat ${esc(loser)}.` : `Upset! Only ${n} people picked ${esc(upset.winner)} to beat ${esc(loser)}.`);
  }
  return out.slice(0,4);
}

  const res = await post({...body, password:ADMIN_PW});
  adminBusy=false;
  if(res.ok){ adminMsg="✓ "+okText; await fetchData(); }
  else { adminMsg="⚠ "+(res.error||"Couldn't save."); if(/password/i.test(res.error||"")){ ADMIN_PW=""; sess.del("pickem-admin-pw"); } }
  render(true);
}
window.adminWinner = (gi,side) => { const g=games[gi]; const w = side==="A"?g.a : side==="H"?g.h : ""; if((g.winner||"")===w) return; g.winner = w||null; adminSend({action:"setWinner", gameId:g.id, winner:w}, w?`${w} saved as the winner.`:"Marked as not played."); };
window.adminTiebreakers = () => { const ot=document.getElementById("ot").value, sc=document.getElementById("sc").value; adminSend({action:"setTiebreakers", ot, score:sc}, "Tiebreaker answers saved."); };
window.setAsOf = v => { asOf = v==="all"?Infinity:+v; render(true); };
function viewAdmin(){
  if(!ADMIN_PW) return `<div class="card" style="max-width:480px"><h2>Admin</h2><p>Enter the admin password to update game results.</p>
    <input id="key" type="password" class="inp" placeholder="Admin password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="btn" onclick="adminLogin()">Unlock</button><p id="keymsg" style="color:var(--loss);font-weight:700"></p></div>`;
  const done=games.filter(g=>g.winner).length;
  const sub = n => META.submitted.some(s=>same(s,n));
  const missing = NAMES.filter(n=>!sub(n));
  return `<div class="card"><h2>Admin</h2>
    <p style="margin-top:0">${done} of ${games.length} games have a winner. Tap the team that won. It saves to your Google Sheet and everyone sees it when they open or refresh the site.</p>
    <p class="muted small">You can also type winners straight into the <b>winner</b> column of the Games tab.</p>
    <p style="font-weight:700;min-height:1.4em;color:${adminMsg.startsWith("⚠")?"var(--loss)":"var(--win)"}">${esc(adminMsg)}</p>
    <div class="chips"><button class="btn ghost" onclick="adminLogout()">Log Out Of Admin</button></div></div>
  <div class="card"><h2>Picks Turned In: ${NAMES.length-missing.length} Of ${NAMES.length}</h2>
    ${missing.length?`<p style="margin:0"><b>Still waiting on:</b> ${missing.map(n=>esc(cap(n))).join(", ")}</p>`:`<p style="margin:0">✓ Everyone's in!</p>`}
    <p class="muted small" style="margin-bottom:0">Picks lock ${esc(lockText())}. Change this in the Settings tab (PICKS_LOCK).</p></div>
  <div class="card"><h2>Tiebreaker Answers</h2><p class="muted" style="margin-top:0">Fill these in at the end of the season.</p>
    <p><b>Bowl games that went to overtime:</b><br><input id="ot" class="inp" style="width:110px" type="number" min="0" value="${esc(META.ot??"")}"></p>
    <p><b>Championship combined score:</b><br><input id="sc" class="inp" style="width:110px" type="number" min="0" value="${esc(META.score??"")}"></p>
    <button class="btn" onclick="adminTiebreakers()" ${adminBusy?"disabled":""}>Save Tiebreakers</button></div>
  <div class="card"><h2>Game Winners</h2><table><tbody>
  ${games.map(g=>`<tr><td><div class="withlogo">${bowlLogo(g,42)}<div><div style="font-weight:700;font-size:18px">${g.round?`<span class="tag cfp">${esc(g.round)}</span> `:""}${esc(g.bowl||"Game")}</div><div class="muted small">${esc(g.date)}${g.time?" · "+esc(g.time):""} · ${g.pts} pts</div></div></div></td>
   <td><div class="chips">
    <button class="btn pick ${g.winner===g.a?"sel":""}" onclick="adminWinner(${g.i},'A')" ${adminBusy?"disabled":""}>${esc(g.a)}</button>
    <button class="btn pick ${g.winner===g.h?"sel":""}" onclick="adminWinner(${g.i},'H')" ${adminBusy?"disabled":""}>${esc(g.h)}</button>
    <button class="btn ghost ${!g.winner?"selp":""}" onclick="adminWinner(${g.i},'')" ${adminBusy?"disabled":""}>Not Played</button></div></td></tr>`).join("")}
  </tbody></table></div>
  <div class="card"><h2>Test Mode</h2><p class="muted" style="margin-top:0">Only changes your own screen. Pretend only some games have been played to check the personal pages.</p>
    <select class="inp" onchange="setAsOf(this.value)"><option value="all">All games</option>${games.map((g,i)=>`<option value="${i+1}" ${asOf===i+1?"selected":""}>After game ${i+1}: ${esc(g.date)} ${esc(g.bowl)}</option>`).join("")}<option value="0" ${asOf===0?"selected":""}>No games played</option></select></div>`;
}

// ---------- router ----------
function render(keepScroll){
  const h=location.hash||"#/";
  const y=window.scrollY;
  if(ME && NAMES.length && !NAMES.some(n=>same(n,ME))){ ME=null; store.del("pickem-me"); }   // name no longer on the list
  hello();
  if(h==="#/admin"){nav("");app.innerHTML=viewAdmin();}
  else if(MODE==="loading" && !NAMES.length){nav("");app.innerHTML=modeNote();}
  else if(!ME || h==="#/welcome"){nav("");app.innerHTML=viewWelcome();}
  else if(h.startsWith("#/member/")){nav("#/members");app.innerHTML=viewMember(decodeURIComponent(h.slice(9)));}
  else if(h==="#/picks"){nav("#/members");app.innerHTML=viewPicks();}
  else if(h==="#/leaderboard"){nav(h);app.innerHTML=viewLeaderboard();}
  else if(h==="#/schedule"){nav(h);app.innerHTML=viewSchedule();}
  else if(h==="#/members"){nav(h);app.innerHTML=viewMembers();}
  else if(h==="#/history"){nav(h);app.innerHTML=viewHistory();}
  else {nav("");app.innerHTML=viewHome();}
  window.scrollTo(0,keepScroll?y:0);
  const row=document.querySelector(".names.compact");
  const on=row && (row.querySelector("a.on") || row.querySelector("a.me"));
  if(on){ row.scrollLeft = Math.max(0, on.offsetLeft - row.offsetLeft - row.clientWidth/2 + on.offsetWidth/2); }
}
window.addEventListener("hashchange",()=>render());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && API_URL) fetchData().then(()=>render(true)); });
if(!API_URL) loadDemo();
render();
fetchData().then(()=>render(true));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Bowl Pick'em</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#16181d;--muted:#5d6270;--line:#e2ded4;--brand:#7a1f1f;--gold:#e0a920;--win:#1f7a3a;--winbg:#e3f4e8;--loss:#b3261e;--lossbg:#fbe4e2;--pend:#8a6d00;--pendbg:#fff5cc}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.4}
  header{background:var(--brand);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:20}
  header h1{margin:0 0 10px;font-size:24px}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav a{color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px;background:rgba(255,255,255,.14);font-size:17px}
  nav a.on{background:#fff;color:var(--brand)}
  .sim{background:#fff8e6;border-bottom:1px solid var(--line);padding:10px 16px;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sim select{font-size:16px;padding:6px 8px;border-radius:8px}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  h2{margin:4px 0 12px;font-size:24px}
  .banner{background:#16181d;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .num{text-align:center}
  .rank{font-weight:800;font-size:20px;width:52px;text-align:center}
  .r1{color:#b8860b}.r2{color:#6b7280}.r3{color:#8b5a2b}
  a.person{color:var(--brand);font-weight:700;text-decoration:none}
  a.person:hover{text-decoration:underline}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips a{padding:10px 14px;border-radius:10px;background:#fff;border:2px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
  .chips a.on{border-color:var(--brand);color:var(--brand)}
  .big{display:flex;gap:16px;flex-wrap:wrap}
  .stat{flex:1;min-width:140px;background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .v{font-size:36px;font-weight:800}
  .stat .l{color:var(--muted);font-size:15px}
  .w{background:var(--winbg);color:var(--win);font-weight:700}
  .l{}
  .x{background:var(--lossbg);color:var(--loss);font-weight:700}
  .p{background:var(--pendbg);color:var(--pend);font-weight:700}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:14px;font-weight:700}
  .cfp{background:#1d3b75;color:#fff}
  .scroll{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  .grid{font-size:14px;border-collapse:separate;border-spacing:0}
  .grid th,.grid td{padding:6px 8px;white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .grid thead th{position:sticky;top:0;background:#16181d;color:#fff;z-index:2;text-transform:none;letter-spacing:0}
  .grid tbody th{position:sticky;left:0;background:#fff;z-index:1;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600}
  .grid thead th:first-child{left:0;z-index:3}
  .muted{color:var(--muted)}
  .root{border-left:5px solid var(--gold)}
  .btn{font:inherit;font-size:16px;font-weight:700;padding:10px 14px;border-radius:10px;border:2px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--brand)}
  .btn.pick{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.pick.sel{background:var(--winbg);color:var(--win);border-color:var(--win)}
  .btn.ghost.selp{background:var(--pendbg);color:var(--pend);border-color:var(--pend)}
  .inp{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);margin:0 8px 8px 0}
  .hello{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-4px 0 10px;font-size:16px}
  .hello a{color:#fff}
  tr.mine td{background:#fff3cd}
  tr.mine td:first-child{box-shadow:inset 5px 0 0 var(--gold)}
  .grid .mycol{background-image:linear-gradient(rgba(224,169,32,.22),rgba(224,169,32,.22))}
  .grid thead th.mycol{background:var(--gold);color:#16181d}
  .grid thead th.mycol a{color:#16181d!important}
  .welcome{max-width:640px;margin:20px auto;text-align:center}
  .welcome h2{font-size:30px}
  .welcome .chips{justify-content:center}
  .welcome .chips a{font-size:20px;padding:14px 20px;min-width:120px;text-align:center}
  .you{border:3px solid var(--gold);background:#fffaf0}
  .chip{display:inline-block;padding:8px 12px;border-radius:10px;font-weight:700;font-size:16px}
  tr.needpick td{background:#fffbea}
  .btn[disabled]{opacity:.6;cursor:wait}
  select.inp{background:#fff;font-size:18px}
  @media(max-width:600px){body{font-size:17px}.hide-sm{display:none}}
</style>
</head>

["1/1","12:00","Orange Bowl (CFP QF)","Oregon","Texas Tech","A","ESPN",8,"CFP QF","AHHAAAHHHHAAAAHAAAHA"],
["1/1","4:00","Rose Bowl (CFP QF)","Alabama","Indiana","H","ESPN",8,"CFP QF",["H","H","H","H","Oklahoma","H","A","H","H","H","H","A","H","H","H","H","H","H","H","A"]],
["1/1","8:00","Sugar Bowl (CFP QF)","Ole Miss","Georgia","A","ESPN",8,"CFP QF","HHHHHHHHHHHAAHHHHHHH"],
["1/2","1:00","Armed Forces Bowl","Rice","Texas State","H","ESPN",5,"","HAAHHAHHHHHHAHHHHHHH"],
["1/2","4:30","Liberty Bowl","Navy","Cincinnati","A","ESPN",5,"","AAAHAAAAAAAAAAAAHAAA"],
["1/2","8:00","Holiday Bowl","Arizona","SMU","H","FOX",6,"","AAAAAAAAAAAAAAAAAHAA"],
["1/2","8:00","Duke's Mayo Bowl","Wake Forest","Mississippi State","A","ESPN",5,"","AAHAAAAAAAAAHAAAAAAA"],
["1/8","7:30","Fiesta Bowl (CFP Semi)","Ole Miss","Miami","H","ESPN",9,"CFP SF",Array(20).fill("Ohio State").map((v,i)=>i===16?"Georgia":v)],
["1/9","7:30","Peach Bowl (CFP Semi)","Indiana","Oregon","A","ESPN",9,"CFP SF",["H","A","A","A","H","A","Texas Tech","A","A","Texas Tech","A","H","A","A","A","A","A","H","A","Alabama"]],
["1/19","7:30","National Championship","Indiana","Miami","A","ESPN",10,"CFP NC",Array(20).fill("Ohio State").map((v,i)=>(i===14||i===16)?"A":v)],
];

const HISTORY = {
  "2026":["JAIME","NAT","JIMMY","JERRICKA","LANDON","DERRICK","DALE","BRAYLON","ASHTON","LANCE","ANDI","MICHELLE","PARKER","ALLY","EMERY","BRYANA","REAGAN","MATT","NANA","KASH"],
  "2025":["NANA","BRAYLON","DERRICK","MATT","NAT","KASH","ALLY","LANCE","JIMMY","ANDI","PARKER","LANDON","JERRICKA","BRYANA","MICHELLE","JAIME","REAGAN","DALE","EMERY"],
  "2024":["KASH","ALLY","ANDI","LANCE","DERRICK","MATT","JERRICKA","PARKER","JIMMY","LANDON","REAGAN","JAIME","MICHELLE","NAT","BRYANA","NANA","PAPAW"],
  "2023":["MATT","LANCE","BRIAN","PAPAW","REAGAN","NANA","MICHELLE","DERRICK","JAIME","JIMMY","ALLY","JERRICKA","KASH","ANDI","PARKER","BRYANA","LANDON"],
  "2022":["ANDI","REAGAN","LANCE","KASH","MATT","ALLY","JERRICKA","JAIME","NANA","PARKER","PAPAW","DERRICK","LANDON","JIMMY","MICHELLE"]
};

// =====================================================================
//  CONNECT TO YOUR GOOGLE SHEET
//  Paste your Apps Script "Web app URL" between the quotes below.
//  Leave it empty ("") to run in demo mode with last season's data.
// =====================================================================
const API_URL = "https://script.google.com/macros/s/AKfycby7O5HPMavbwEjHhXK47SsiObTxruSVCjmJu0qIknTd4BsW2pWmhEeigI1MxFg-qFy3OA/exec";

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => { s=String(s||""); return s===s.toUpperCase() ? s.charAt(0)+s.slice(1).toLowerCase() : s; };
const same = (x,y) => String(x||"").trim().toLowerCase() === String(y||"").trim().toLowerCase() && String(x||"").trim()!=="";
const store = { get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}, del:k=>{try{localStorage.removeItem(k);}catch(e){}} };
const sess  = { get:k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}}, set:(k,v)=>{try{sessionStorage.setItem(k,v);}catch(e){}}, del:k=>{try{sessionStorage.removeItem(k);}catch(e){}} };

// ---------- state ----------
let MODE = API_URL ? "loading" : "demo";   // demo | loading | live | error
let LOAD_ERROR = "";
let games = [];          // {id,i,date,time,bowl,a,h,tv,pts,round,playoff,winner}
let NAMES = [];          // everyone playing
let PICKS = {};          // name -> {picks:[team per game], ot, score}   (only once picks lock)
let META = { season:"", locked:true, lockAt:null, submitted:[], ot:null, score:null };
let asOf = Infinity;     // admin-only test mode

function loadDemo(){
  games = G.map((g,i)=>{ const [date,time,bowl,a,h,w,tv,pts,round]=g; return {id:"g"+(i+1),i,date,time,bowl,a,h,tv,pts,round,playoff:!!round,winner:w==="A"?a:h}; });
  NAMES = [...PEOPLE];
  PICKS = {};
  PEOPLE.forEach((p,pi)=>{ PICKS[p] = { picks: G.map(g=>{ const raw=g[9]; const v=raw[pi]; return v==="A"?g[3] : v==="H"?g[4] : v; }), ot: OT_GUESS[pi], score: null }; });
  META = { season:"2025–26 (demo data)", locked:true, lockAt:null, submitted:[...PEOPLE], ot:ACTUAL_OT, score:null };
}

function loadFromApi(d){
  games = (d.games||[]).map((g,i)=>{
    const a=String(g.a||""), h=String(g.h||"");
    const winner = same(g.winner,a) ? a : same(g.winner,h) ? h : null;
    return {id:String(g.id), i, date:String(g.date||""), time:String(g.time||""), bowl:String(g.bowl||""), a, h, tv:String(g.tv||""), pts:Number(g.pts)||0, round:String(g.round||""), playoff:!!g.round, winner};
  });
  NAMES = (d.people||[]).map(String);
  PICKS = {};
  (d.picks||[]).forEach(p=>{
    const name = NAMES.find(n=>same(n,p.name)) || String(p.name);
    PICKS[name] = { picks: games.map(g=>String((p.picks||{})[g.id]||"")), ot: p.ot, score: p.score };
  });
  META = { season:String(d.season||""), locked:!!d.locked, lockAt:d.lockAt||null, submitted:(d.submitted||[]).map(String), ot:d.ot??null, score:d.score??null };
}

async function fetchData(){
  if(!API_URL){ loadDemo(); MODE="demo"; return; }
  try{
    const r = await fetch(API_URL + (API_URL.includes("?")?"&":"?") + "t=" + Date.now());
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||"bad response");
    loadFromApi(d); MODE="live"; LOAD_ERROR="";
  }catch(e){
    if(MODE!=="live"){ MODE="error"; }
    LOAD_ERROR = String(e.message||e);
  }
}

async function post(body){
  if(!API_URL) return {ok:false, error:"The site isn't connected to the Google Sheet yet."};
  try{
    const r = await fetch(API_URL, {method:"POST", body:JSON.stringify(body)});
    return await r.json();
  }catch(e){ return {ok:false, error:"Couldn't reach the Google Sheet. Check your internet and try again."}; }
}

// ---------- scoring ----------
const isDone = g => !!g.winner && g.i < asOf;
const doneCount = () => games.filter(isDone).length;
const players = () => NAMES.filter(n=>PICKS[n]);
const pickOf = (name,g) => PICKS[name] ? PICKS[name].picks[g.i] : "";
const allDone = () => games.length>0 && games.every(isDone);

function standings(){
  const final = allDone();
  const rows = players().map(name=>{
    let pts=0,correct=0,po=0,remain=0;
    games.forEach(g=>{
      const pick = pickOf(name,g);
      if(isDone(g)){ if(same(pick,g.winner)){pts+=g.pts;correct++;if(g.playoff)po++;} }
      else if(same(pick,g.a)||same(pick,g.h)){ remain+=g.pts; }
    });
    const p = PICKS[name];
    const otDiff = (META.ot!==null && p.ot!==null && p.ot!==undefined) ? Math.abs(p.ot-META.ot) : 0;
    const scDiff = (META.score!==null && p.score!==null && p.score!==undefined) ? Math.abs(p.score-META.score) : 0;
    return {name,pts,correct,po,remain,ot:p.ot,score:p.score,otDiff,scDiff};
  });
  rows.sort((x,y)=> y.pts-x.pts || y.correct-x.correct || y.po-x.po || (final?(x.otDiff-y.otDiff)||(x.scDiff-y.scDiff):0) || x.name.localeCompare(y.name));
  rows.forEach((r,i)=>{
    const p=rows[i-1];
    const tied = p && p.pts===r.pts && p.correct===r.correct && p.po===r.po && (!final || (p.otDiff===r.otDiff && p.scDiff===r.scDiff));
    r.rank = tied ? p.rank : i+1;
  });
  return rows;
}

const lastResult = () => { const d=games.filter(isDone); if(!d.length) return "No games played yet"; const g=d[d.length-1]; return `Last Updated: ${esc(g.winner)} over ${esc(g.winner===g.a?g.h:g.a)}`; };
const lockText = () => META.lockAt ? "on " + new Date(META.lockAt).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "at the first kickoff";

// ---------- who am I (saved on this device) ----------
let ME = store.get("pickem-me");
const GUEST="__guest";
const isMe = n => ME && ME!==GUEST && same(ME,n);
const namesMeFirst = () => [...NAMES].sort((a,b)=>(isMe(b)-isMe(a))||a.localeCompare(b));
const star = n => (isMe(n)?"⭐ ":"")+esc(cap(n));
const nameKey = n => encodeURIComponent(n);
window.chooseMe = i => { ME = i<0 ? GUEST : NAMES[i]; store.set("pickem-me",ME); location.hash = "#/"; render(); };
window.switchMe = () => { ME=null; store.del("pickem-me"); location.hash="#/welcome"; render(); };

// my own submitted picks, remembered on this device (so I can edit before the deadline)
const draftKey = n => "pickem-draft-" + (META.season||"season") + "-" + String(n).toLowerCase();
const loadDraft = n => { try{ return JSON.parse(store.get(draftKey(n))||"null"); }catch(e){ return null; } };
const saveDraft = (n,d) => store.set(draftKey(n), JSON.stringify(d));

// ---------- views ----------
const app=document.getElementById("app");
function nav(active){
  const links=[["#/","Leaderboard"],["#/members","Picks"],["#/schedule","Schedule"],["#/history","History"]];
  document.getElementById("nav").innerHTML=links.map(([h,t])=>`<a href="${h}" class="${active===h?"on":""}">${t}</a>`).join("");
}
const rankCls = r => r===1?"r1":r===2?"r2":r===3?"r3":"";
const personLink = n => `<a class="person" href="#/member/${nameKey(n)}">${esc(cap(n))}</a>`;
const bigBtn = (href,text) => `<a class="btn" style="text-decoration:none;display:inline-block" href="${href}">${text}</a>`;

function modeNote(){
  if(MODE==="demo") return `<div class="card" style="background:#eef4ff;border-color:#c9d8f5"><b>Demo mode:</b> showing last season's picks and results. Connect the Google Sheet to go live.</div>`;
  if(MODE==="error") return `<div class="card" style="color:var(--loss)"><b>Can't reach the Google Sheet right now.</b> Check your internet and refresh the page.</div>`;
  if(MODE==="loading") return `<div class="card muted">Loading the latest picks and results…</div>`;
  return "";
}

function hello(){
  const el=document.getElementById("hello");
  if(!ME){el.innerHTML="";return;}
  el.innerHTML = ME===GUEST
    ? `<span>Just looking</span><a href="javascript:void 0" onclick="switchMe()">Pick your name</a>`
    : `<span>Hi, <a href="#/member/${nameKey(ME)}"><b>${esc(cap(ME))}</b></a>!</span><a href="javascript:void 0" onclick="switchMe()">Not you? Switch</a>`;
}

function viewWelcome(){
  return `<div class="welcome card"><h2>👋 Welcome! Who are you?</h2>
  <p>Tap your name so the site can show <b>your</b> picks, rank and the games you need to win.</p>

function viewMember(rawName){
  const name = NAMES.find(n=>same(n,rawName)) || Object.keys(PICKS).find(n=>same(n,rawName));
  if(!name) return viewMembers();
  const you = isMe(name) || !ME || ME===GUEST;
  const chips = `<div class="chips" style="margin-bottom:16px">${namesMeFirst().map(p=>`<a class="${p===name?"on":""}" href="#/member/${nameKey(p)}">${star(p)}</a>`).join("")}${allBtn}</div>`;

  if(!META.locked){
    const d = isMe(name) ? loadDraft(name) : null;
    const isIn = META.submitted.some(s=>same(s,name));
    let body;
    if(d && d.picks){
      body = `<p>${isIn?"✓ Your picks are in.":"You haven't submitted yet."} Only you can see these until picks lock ${esc(lockText())}.</p>
       <p>${bigBtn("#/submit","Change my picks →")}</p>
       <table><tbody>${games.map(g=>`<tr><td>${esc(g.date)} · ${esc(g.bowl)}</td><td class="p">${esc(d.picks[g.id]||"—")}</td></tr>`).join("")}</tbody></table>
       <p><b>Tiebreakers:</b> ${esc(d.ot??"—")} overtime games · championship score ${esc(d.score??"—")}</p>`;
    } else {
      body = `<p>${isIn?"✓ Picks are in.":"No picks yet."} Everyone's picks are hidden until picks lock ${esc(lockText())}.</p>${isMe(name)&&games.length?bigBtn("#/submit","Make my picks →"):""}`;
    }
    return `${chips}<div class="card"><h2>${esc(cap(name))}</h2>${body}</div>`;
  }

  if(!PICKS[name]) return `${chips}<div class="card"><h2>${esc(cap(name))}</h2><p>${esc(cap(name))} didn't turn in picks this season.</p></div>`;
  const rows=standings(); const me=rows.find(r=>r.name===name); const leader=rows[0];
  const playoffDone=games.filter(g=>isDone(g)&&g.playoff).length;
  const upcoming=games.filter(g=>!isDone(g));
  const rootFor = leader.name===name ? [] : upcoming.filter(g=>!same(pickOf(name,g),pickOf(leader.name,g)) && (same(pickOf(name,g),g.a)||same(pickOf(name,g),g.h)));
  const behind = leader.pts-me.pts;
  const subj = you ? "You're" : `${esc(cap(name))} is`;
  const status = leader.name===name ? `🏆 ${subj} in first place!` :
    upcoming.length===0 ? "Season complete." :
    me.remain>=behind ? `${subj} ${behind} points behind ${esc(cap(leader.name))} with ${me.remain} points still possible.` :
    `${subj} ${behind} points behind ${esc(cap(leader.name))}. Only ${me.remain} points are left, so first place is out of reach.`;

  return `${chips}
  <div class="card"><h2>${esc(cap(name))}</h2>
   <div class="big">
    <div class="stat"><div class="v ${rankCls(me.rank)}">#${me.rank}</div><div class="l">Current rank</div></div>
    <div class="stat"><div class="v">${me.pts}</div><div class="l">Total points</div></div>
    <div class="stat"><div class="v">${me.correct}<span class="muted" style="font-size:22px"> / ${doneCount()}</span></div><div class="l">Correct picks</div></div>
    <div class="stat"><div class="v">${me.po}<span class="muted" style="font-size:22px"> / ${playoffDone}</span></div><div class="l">Playoff picks correct</div></div>
    <div class="stat"><div class="v">${me.remain}</div><div class="l">Points still possible</div></div>
   </div>
   <p style="margin:14px 0 0"><b>Tiebreakers:</b> ${esc(me.ot??"—")} overtime games · championship score ${me.score!==null&&me.score!==undefined?esc(me.score):`<span class="muted">not entered</span>`}</p>
  </div>
  <div class="card root"><h2>${you?"What I need to win":`What ${esc(cap(name))} needs to win`}</h2><p>${status}</p>
   ${rootFor.length?`<table><thead><tr><th>Game</th><th>Root for</th><th class="hide-sm">${esc(cap(leader.name))} picked</th><th class="num">Pts</th></tr></thead><tbody>
    ${rootFor.map(g=>`<tr><td>${esc(g.date)} · ${esc(g.bowl)}</td><td class="w">${esc(pickOf(name,g))}</td><td class="hide-sm">${esc(pickOf(leader.name,g))}</td><td class="num">${g.pts}</td></tr>`).join("")}</tbody></table>`
    : (upcoming.length&&leader.name!==name?`<p class="muted">Same picks as ${esc(cap(leader.name))} in every game left.</p>`:"")}
  </div>
  <div class="card"><h2>${you?"My picks":`${esc(cap(name))}'s picks`}</h2>
   <table><thead><tr><th>Date</th><th>Game</th><th>Pick</th><th class="num">Pts</th></tr></thead><tbody>
   ${games.map(g=>{const pick=pickOf(name,g);const done=isDone(g);const ok=done&&same(pick,g.winner);const cls=!done?"p":ok?"w":"x";
     return `<tr><td>${esc(g.date)}</td><td>${g.round?`<span class="tag cfp">${esc(g.round)}</span> `:""}${esc(g.a)} vs ${esc(g.h)}<div class="muted" style="font-size:14px">${esc(g.bowl)}</div></td><td class="${cls}">${esc(pick||"—")}</td><td class="num ${cls}">${!done?"—":ok?"+"+g.pts:"0"}</td></tr>`;}).join("")}
   </tbody></table></div>`;
}

// --- make my picks ---
let draft = null;   // {name, picks:{gid:team}, ot, score}
let submitMsg = "", submitting = false;
function startDraft(){
  const name = (ME && ME!==GUEST && NAMES.find(n=>same(n,ME))) || "";
  const saved = name ? loadDraft(name) : null;
  draft = saved && saved.picks ? {name, picks:{...saved.picks}, ot:saved.ot??"", score:saved.score??""} : {name, picks:{}, ot:"", score:""};
}
window.draftName = v => { const name = v===""?"":NAMES[+v]; const saved = name?loadDraft(name):null; draft = saved&&saved.picks ? {name,picks:{...saved.picks},ot:saved.ot??"",score:saved.score??""} : {name,picks:{},ot:"",score:""}; submitMsg=""; render(true); };
window.draftPick = (gi,side) => { const g=games[gi]; draft.picks[g.id] = side==="A"?g.a:g.h; submitMsg=""; render(true); };
window.draftNum = (k,v) => { draft[k]=v; };
window.submitPicks = async () => {
  if(submitting) return;
  const missing = games.filter(g=>!draft.picks[g.id]).length;
  if(!draft.name){ submitMsg="⚠ Pick your name at the top first."; render(true); return; }
  if(!games.length){ submitMsg="⚠ This season's games aren't posted yet."; render(true); return; }
  if(missing){ submitMsg=`⚠ You still need to pick ${missing} game${missing>1?"s":""} (they're in yellow).`; render(true); return; }
  if(draft.ot===""||draft.ot===null||isNaN(+draft.ot)||+draft.ot<0){ submitMsg="⚠ Enter how many bowl games will go to overtime."; render(true); return; }
  if(draft.score===""||draft.score===null||isNaN(+draft.score)||+draft.score<0){ submitMsg="⚠ Enter your guess for the championship combined score."; render(true); return; }
  submitting=true; submitMsg="Sending your picks…"; render(true);
  const res = await post({action:"submitPicks", name:draft.name, picks:draft.picks, ot:+draft.ot, score:+draft.score});
  submitting=false;
  if(res.ok){
    saveDraft(draft.name, {picks:draft.picks, ot:+draft.ot, score:+draft.score});
    if(!META.submitted.some(s=>same(s,draft.name))) META.submitted.push(draft.name);
    submitMsg="✅ Your picks are in! You can change them until picks lock.";
    if(!ME || ME===GUEST){ ME=draft.name; store.set("pickem-me",ME); }
  } else submitMsg="⚠ "+(res.error||"Something went wrong. Try again.");
  render(true);
};
function viewSubmit(){
  if(META.locked) return `${modeNote()}<div class="card"><h2>🔒 Picks are locked</h2><p>The deadline has passed, so picks can't be changed anymore. Good luck!</p>${bigBtn("#/","See the leaderboard →")}</div>`;
  if(!games.length) return `${modeNote()}${noGamesCard()}`;
  if(!draft) startDraft();
  const sel = NAMES.findIndex(n=>same(n,draft.name));
  const missing = games.filter(g=>!draft.picks[g.id]).length;
  const msgColor = submitMsg.startsWith("✅") ? "var(--win)" : submitMsg.startsWith("⚠") ? "var(--loss)" : "var(--muted)";
  return `${modeNote()}<div class="card you"><h2>Make my picks</h2>
    <p style="margin-top:0">Tap the team you think will win each game. Picks lock ${esc(lockText())}.</p>
    <label><b>I am:</b> <select class="inp" onchange="draftName(this.value)"><option value="">Choose your name…</option>${NAMES.map((n,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(cap(n))}</option>`).join("")}</select></label>
    <p style="margin:6px 0 0" class="muted">${games.length-missing} of ${games.length} games picked</p></div>
  <div class="card"><table><tbody>
  ${games.map(g=>{const p=draft.picks[g.id];return `<tr class="${p?"":"needpick"}"><td>${esc(g.date)}<div class="muted" style="font-size:14px">${g.round?`<span class="tag cfp">${esc(g.round)}</span> `:""}${esc(g.bowl)} · ${g.pts} pts</div></td>
   <td><div class="chips">
    <button class="btn pick ${same(p,g.a)?"sel":""}" onclick="draftPick(${g.i},'A')">${esc(g.a)}</button>
    <button class="btn pick ${same(p,g.h)?"sel":""}" onclick="draftPick(${g.i},'H')">${esc(g.h)}</button></div></td></tr>`;}).join("")}
  </tbody></table></div>
  <div class="card"><h2>Tiebreakers</h2>
   <p><b>How many bowl games will go to overtime?</b><br><input class="inp" type="number" min="0" inputmode="numeric" value="${esc(draft.ot)}" oninput="draftNum('ot',this.value)"></p>
   <p><b>National Championship: total points scored by both teams?</b><br><input class="inp" type="number" min="0" inputmode="numeric" value="${esc(draft.score)}" oninput="draftNum('score',this.value)"></p>
   <button class="btn" style="font-size:20px;padding:14px 22px" onclick="submitPicks()" ${submitting?"disabled":""}>${submitting?"Sending…":"Submit my picks"}</button>
   <p id="submitmsg" style="font-weight:700;color:${msgColor};min-height:1.4em">${esc(submitMsg)}</p></div>`;
}

// --- admin ---
let ADMIN_PW = sess.get("pickem-admin-pw") || "";
let adminMsg = "", adminBusy = false;
window.adminLogin = async () => {
  const pw = document.getElementById("key").value;
  if(!API_URL){ document.getElementById("keymsg").textContent="Connect the Google Sheet first (see the setup guide)."; return; }
  document.getElementById("keymsg").textContent="Checking…";
  const res = await post({action:"checkPassword", password:pw});
  if(res.ok){ ADMIN_PW=pw; sess.set("pickem-admin-pw",pw); adminMsg=""; render(); }
  else document.getElementById("keymsg").textContent = res.error || "That password isn't right.";
};
window.adminLogout = () => { ADMIN_PW=""; sess.del("pickem-admin-pw"); asOf=Infinity; location.hash="#/"; render(); };
async function adminSend(body, okText){
  adminBusy=true; adminMsg="Saving…"; render(true);
  const res = await post({...body, password:ADMIN_PW});
  adminBusy=false;
  if(res.ok){ adminMsg="✓ "+okText; await fetchData(); }
  else { adminMsg="⚠ "+(res.error||"Couldn't save."); if(/password/i.test(res.error||"")){ ADMIN_PW=""; sess.del("pickem-admin-pw"); } }
  render(true);
}
window.adminWinner = (gi,side) => { const g=games[gi]; const w = side==="A"?g.a : side==="H"?g.h : ""; if((g.winner||"")===w) return; g.winner = w||null; adminSend({action:"setWinner", gameId:g.id, winner:w}, w?`${w} saved as the winner.`:"Marked as not played."); };
window.adminTiebreakers = () => { const ot=document.getElementById("ot").value, sc=document.getElementById("sc").value; adminSend({action:"setTiebreakers", ot, score:sc}, "Tiebreaker answers saved."); };
window.setAsOf = v => { asOf = v==="all"?Infinity:+v; render(true); };

// ---------- router ----------
function render(keepScroll){
  const h=location.hash||"#/";
  const y=window.scrollY;
  hello();
  if(h==="#/admin"){nav("");app.innerHTML=viewAdmin();}
  else if(MODE==="loading" && !NAMES.length){nav("");app.innerHTML=modeNote();}
  else if(!ME || h==="#/welcome"){nav("");app.innerHTML=viewWelcome();}
  else if(h.startsWith("#/member/")){nav("#/members");app.innerHTML=viewMember(decodeURIComponent(h.slice(9)));}
  else if(h==="#/picks"){nav("#/members");app.innerHTML=viewPicks();}
  else if(h==="#/submit"){nav("#/members");app.innerHTML=viewSubmit();}
  else if(h==="#/schedule"){nav(h);app.innerHTML=viewSchedule();}
  else if(h==="#/members"){nav(h);app.innerHTML=viewMembers();}
  else if(h==="#/history"){nav(h);app.innerHTML=viewHistory();}
  else {nav("#/");app.innerHTML=viewLeaderboard();}
  window.scrollTo(0,keepScroll?y:0);
}
window.addEventListener("hashchange",()=>{ if(location.hash!=="#/submit") submitMsg=""; render(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && API_URL && !location.hash.startsWith("#/submit")) fetchData().then(()=>render(true)); });
if(!API_URL) loadDemo();
render();
fetchData().then(()=>render(true));
</script>
